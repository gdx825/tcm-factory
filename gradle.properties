# 内存受限环境（容器 / CI，如 cgroup 上限 8GB）下，Gradle daemon 堆 + Kotlin 编译器
# + D8 的峰值叠加可能触发 OOM 导致 daemon 被杀（报错 daemon disappeared）。
# 遇到该问题时可进一步下调 -Xmx 并保持 parallel=false。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
